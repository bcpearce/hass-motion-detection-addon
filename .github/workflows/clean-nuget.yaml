on:
    workflow_dispatch:
    pull_request:

jobs:
    clear_nuget_cache:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                package:
                    - opencv4
                    - live555
                    - openh264
                triplet: [x64-linux, x64-windows, arm64-linux]
        steps:
            - name: Delete old cached nuget packages
              uses: actions/delete-package-versions@v5
              continue-on-error: true
              with:
                  package-name: "${{ matrix.package }}_${{ matrix.triplet }}"
                  package-type: nuget
                  min-versions-to-keep: 1
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
